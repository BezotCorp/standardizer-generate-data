[package]
name = "standardizer-generate-data"
version = "1.2.0"
edition = "2024"
description = "Generate binary data used by Standardizer"
license = "Apache-2.0"
repository = "https://github.com/BezotCorp/standardizer-generate-data"
readme = "README.md"
publish = true

[dependencies]
standardizer-common = { version = "=2.3.0", features = ["encode", "source"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
semver = { version = "1", features = ["serde"] }

[dev-dependencies]
standardizer-common = { version = "=2.3.0", features = ["decode"] }
tempfile = "3"
