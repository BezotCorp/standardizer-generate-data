name: Global Orchestrator

on:
  pull_request:
    branches:
      - dev
      - main

  pull_request_target:
    branches:
      - main
    types:
      - closed

jobs:
  ci:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/worker-ci.yml

  guard:
    name: Pre-merge guard
    needs: ci
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'main' &&
      github.head_ref != 'release/pending'
    permissions:
      contents: read
    uses: ./.github/workflows/worker-guard.yml

  main:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref != 'release/pending'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/main-orchestrator.yml
    secrets: inherit
